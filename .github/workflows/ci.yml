name: ci
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (no GPU, no vLLM)
        run: python -m unittest discover -s plugin/tests -p test_policy.py -v
      - name: Build the plugin package
        run: |
          python -m pip install --upgrade build
          python -m build plugin
      - name: Shell scripts parse
        run: for f in bench/*.sh deploy/pod/*.sh deploy/runpod/pod.sh; do bash -n "$f"; done
